name: Keeper

on:
  schedule:
    # Runs every 5 minutes on the default branch.
    # Note: GitHub disables scheduled workflows after 60 days of repository
    # inactivity. Re-enable via Actions → Keeper → Enable workflow.
    # Scheduled runs only execute on the default branch.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to simulate only — no transactions sent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Minimal permissions — the keeper reads/writes to the chain, not to the repo.
# Note: Actions logs on public repositories are publicly visible.
# Never log secrets, private keys, or API keys in any run step.
permissions:
  contents: read

# Prevent overlapping runs — only one keeper can execute at a time.
concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  run-keeper:
    name: Execute due payments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to the exact Bun version this repo was developed against
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run keeper
        env:
          KEEPER_PRIVATE_KEY:           ${{ secrets.KEEPER_PRIVATE_KEY }}
          SPLIT_NETWORK:                ${{ vars.SPLIT_NETWORK }}
          SCHEDULED_SPLIT_ADDRESS:      ${{ vars.SCHEDULED_SPLIT_ADDRESS }}
          # RPC_URL may contain a provider API key — store as a secret, not a var
          RPC_URL:                      ${{ secrets.RPC_URL }}
          # Pass dry_run via env so it is not interpolated into shell commands
          DRY_RUN:                      ${{ inputs.dry_run }}
        run: bun run scripts/keeper.ts
