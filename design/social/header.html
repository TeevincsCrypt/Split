<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
.h{position:relative;width:1500px;height:500px;overflow:hidden;font-family:Manrope,sans-serif;color:#141414;
 background:#F3F2F1;
 background-image:linear-gradient(#EBC9D533 1px,transparent 1px),linear-gradient(90deg,#EBC9D533 1px,transparent 1px);
 background-size:40px 40px}
.copy{position:absolute;left:470px;top:112px;width:560px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:#641532;background:#F7E9EE;border:1px solid #EBC9D5;padding:8px 16px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#641532}
h1{margin:22px 0 14px;font-size:68px;line-height:1.02;font-weight:800;letter-spacing:-0.035em}
h1 span{color:#641532}
p{margin:0;font-size:24px;line-height:1.4;color:#6F6B68;font-weight:500}
.card{position:absolute;right:70px;top:78px;width:380px;background:#fff;border-radius:30px;padding:26px 28px;
 box-shadow:0 18px 50px rgba(20,20,20,.08);border:1px solid #ECEAE8}
.lab{font-size:13px;letter-spacing:.14em;font-weight:700;color:#A29E9A}
.pay{display:flex;align-items:baseline;gap:8px;margin:8px 0 16px}
.pay b{font-size:44px;font-weight:800;letter-spacing:-0.03em}.pay small{font-size:18px;color:#6F6B68;font-weight:700}
.row{display:flex;justify-content:space-between;font-size:17px;font-weight:600;margin-top:12px}
.bar{height:7px;border-radius:9px;background:#F1EEEC;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#641532;border-radius:9px}
.row em{font-style:normal;color:#641532}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid #ECEAE8;display:flex;justify-content:space-between;font-size:15px;color:#6F6B68;font-weight:600}
.mark{position:absolute;left:470px;bottom:62px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-0.02em}
.mark span{font-weight:600;color:#A29E9A;font-size:18px;letter-spacing:0}
.ring{position:absolute;left:-120px;top:-150px;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle,#641532 0 23%,#D99BB0 23% 40%,#EBC9D5 40% 58%,#F7E9EE 58% 76%,transparent 76%);opacity:.9}
</style></head><body><div class="h">
<div class="ring"></div>
<div class="copy">
 <div class="kicker"><i class="dot"></i>USDC payouts on Arc</div>
 <h1>Pay everyone.<br><span>In one move.</span></h1>
 <p>One payment. Every contributor. Done.</p>
</div>
<div class="mark"><svg height="30" viewBox="0 0 107 145"><path fill="#641532" d="M8.00 47.25 L70.88 10.21 A16 16 0 1 1 79.00 40.00 L22.00 40.00 L22.00 60.00 L99.00 60.00 L99.00 97.75 L36.12 134.79 A16 16 0 1 1 28.00 105.00 L85.00 105.00 L85.00 85.00 L8.00 85.00 Z"/></svg>Split <span>· one onchain transaction</span></div>
<div class="card">
 <div class="lab">ONE PAYMENT → FOUR RECIPIENTS</div>
 <div class="pay"><b>100.00</b><small>USDC</small></div>
 <div class="row"><span>Developer</span><em>40.00</em></div><div class="bar"><i style="width:40%"></i></div>
 <div class="row"><span>Designer</span><em>25.00</em></div><div class="bar"><i style="width:25%"></i></div>
 <div class="row"><span>Community</span><em>20.00</em></div><div class="bar"><i style="width:20%"></i></div>
 <div class="row"><span>Marketing</span><em>15.00</em></div><div class="bar"><i style="width:15%"></i></div>
 <div class="foot"><span>Atomic · Non-custodial</span><span>Example</span></div>
</div>
</div></body></html>
