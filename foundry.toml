[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# ScheduledSplit needs the IR pipeline (stack depth with 50 recipients); everything
# else, including SplitDistributor, keeps the legacy pipeline so its bytecode matches
# the audited testnet deployment.
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [
  { paths = "contracts/ScheduledSplit.sol", via_ir = true },
  { paths = "contracts/test/ScheduledSplit.*.t.sol", via_ir = true },
]

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
